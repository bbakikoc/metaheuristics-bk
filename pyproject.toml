[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaheuristics-bk-v3"
version = "0.3.5"
description = "Universal Meta-Heuristic Library — Binary, Continuous, Categorical, Mixed + NSGA-II + Constraints"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Baki Koç" }]
keywords = ["metaheuristic", "optimization", "feature-selection", "genetic-algorithm",
            "particle-swarm", "differential-evolution", "abc", "gwo",
            "multi-objective", "nsga2", "constraint-handling",
            "binary", "continuous", "categorical", "mixed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
extras = ["scikit-learn>=1.0", "xgboost>=1.7"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/bbakikoc/metaheuristics-bk"

[tool.setuptools]
py-modules = ["metaheuristics_bk_v3"]
